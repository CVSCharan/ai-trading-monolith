<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="AI Trader — Multi-Broker Algorithmic Options Trading Terminal (Groww, Upstox, NSE & MCX)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AI Trader — Quantitative Options &amp; Algo Terminal</title>
    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .app-preloader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020617;
      }
      .app-preloader-card {
        width: 100%;
        max-width: 360px;
        margin: 16px;
        padding: 32px 24px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.7);
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 0 50px -10px rgba(14, 165, 233, 0.15);
      }
      .app-preloader-logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: block;
        animation: pulseLogo 2s ease-in-out infinite;
      }
      .app-preloader-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #ffffff;
        margin: 0 0 4px;
      }
      .app-preloader-sub {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 0 0 20px;
      }
      .app-preloader-bar {
        height: 5px;
        width: 100%;
        background: rgba(30, 41, 59, 0.8);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .app-preloader-shimmer {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #0ea5e9, #6366f1, #10b981);
        border-radius: 9999px;
        animation: preloaderSlide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes pulseLogo {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.97); }
      }
      @keyframes preloaderSlide {
        0% { left: -40%; width: 35%; }
        50% { left: 35%; width: 50%; }
        100% { left: 100%; width: 35%; }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root">
      <div class="app-preloader">
        <div class="app-preloader-card">
          <img src="/logo.svg" alt="AI Trader Logo" class="app-preloader-logo" />
          <h1 class="app-preloader-title">AI Trader</h1>
          <p class="app-preloader-sub">Quantitative Options &amp; Algo Terminal</p>
          <div class="app-preloader-bar">
            <div class="app-preloader-shimmer"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
