name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  install-and-typecheck:
    name: Install & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.1.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint

  test:
    name: Test (TZ Matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, "America/New_York"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.1.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: TZ=${{ matrix.tz }} bun test
        env:
          TZ: ${{ matrix.tz }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        run: |
          # Fail if any real credential patterns or private keys are committed
          if git grep -nE '(-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk_live_[A-Za-z0-9]{20,}|npg_[A-Za-z0-9]{10,})' -- ':!*.md' ':!*.example' ':!.gitignore' -- .; then
            echo "::error::Potential secrets found in code"
            exit 1
          fi
          echo "No secrets detected"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [install-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.1.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build all packages
        run: bun run build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
